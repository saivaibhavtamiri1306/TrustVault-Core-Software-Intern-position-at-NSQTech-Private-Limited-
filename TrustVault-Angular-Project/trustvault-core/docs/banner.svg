<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="TrustVault Core banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02040a"/><stop offset="1" stop-color="#0a1226"/></linearGradient>
    <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#b535f6"/></linearGradient>
    <radialGradient id="gl"><stop offset="0" stop-color="#00f0ff" stop-opacity=".45"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g opacity=".5" stroke="#00f0ff" stroke-opacity=".08"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/><path d="M100 0V360M300 0V360M500 0V360M700 0V360M900 0V360M1100 0V360"/></g>
  <g transform="translate(930 180)">
    <circle r="150" fill="url(#gl)"><animate attributeName="r" values="140;165;140" dur="4s" repeatCount="indefinite"/></circle>
    <g fill="none" stroke-width="2">
      <circle r="60" stroke="#00f0ff"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/></circle>
      <ellipse rx="100" ry="38" stroke="#b535f6"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/></ellipse>
      <ellipse rx="130" ry="60" stroke="#ff003c" stroke-opacity=".7"><animateTransform attributeName="transform" type="rotate" from="30" to="390" dur="18s" repeatCount="indefinite"/></ellipse>
    </g>
    <g fill="#00f0ff"><circle cx="60" r="6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/></circle></g>
    <rect x="-26" y="-18" width="52" height="40" rx="8" fill="#02040a" stroke="#00f0ff" stroke-width="3"/>
    <path d="M-14 -18v-12a14 14 0 0 1 28 0v12" fill="none" stroke="#00f0ff" stroke-width="3"/>
    <circle cy="2" r="5" fill="#00f0ff"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="70" y="150" font-family="Arial,Helvetica,sans-serif" font-size="30" letter-spacing="10" fill="#22d3ee">TRUSTVAULT</text>
  <text x="66" y="235" font-family="Arial,Helvetica,sans-serif" font-size="96" font-weight="700" fill="url(#tx)">CORE</text>
  <text x="70" y="285" font-family="monospace" font-size="20" fill="#94a3b8">Angular · Tailwind CSS · Three.js · RxJS · 24 pro features</text>
  <rect x="70" y="300" width="260" height="3" fill="#00f0ff"><animate attributeName="width" values="40;260;40" dur="5s" repeatCount="indefinite"/></rect>
</svg>
